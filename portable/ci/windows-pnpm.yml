name: Windows portable pnpm FAT32
on:
  workflow_dispatch:
permissions: {}
jobs:
  fat32-drive-move:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Read public source without repository credentials
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/${{ github.repository }}.git source
          if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }
          if ((git -C source rev-parse HEAD) -ne '${{ github.sha }}') { throw 'Source changed before this run; dispatch the current commit' }
      - name: Exercise real FAT32 VHD and two drive-letter changes
        shell: pwsh
        run: ./source/portable/scripts/check-pnpm-fat32.ps1
