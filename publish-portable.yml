name: Publish audited portable source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portable-source-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: shiyu429
      GIT_AUTHOR_EMAIL: 176587637+shiyu429@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Assemble the audited source tree and publish
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --depth=1 https://github.com/deepseek-ai/deepseek-harness.git b830ec950faba0a46dda564be3e2d854afed94f1
          python3 - <<'PY'
          import subprocess,json,os,base64
          def git(*args,data=None):
              return subprocess.check_output(['git',*args],input=data).decode().strip()
          plan=json.loads(git('show',os.environ['GITHUB_SHA']+':portable-source.json'))
          assert plan['format']==2 and plan['upstream']=='b830ec950faba0a46dda564be3e2d854afed94f1'
          git('read-tree','--empty')
          git('read-tree','--prefix=upstream/',plan['upstream'])
          def install(entry,prefix=''):
              path=prefix+entry['path']
              assert not path.startswith('/') and '..' not in path.split('/')
              if entry.get('sha','') is None:
                  git('update-index','--force-remove','--',path)
              else:
                  blob=git('hash-object','-w','--stdin',data=entry['content'].encode('utf8'))
                  git('update-index','--add','--cacheinfo',entry['mode'],blob,path)
          for entry in plan['changes']: install(entry,'upstream/')
          for entry in plan['root']:
              if entry['type']=='tree':
                  assert entry['path']=='upstream' and entry['sha']==plan['expectedUpstreamTree']
              else: install(entry)
          tree=git('write-tree')
          assert tree==plan['expectedTree'],(tree,plan['expectedTree'])
          commit=git('commit-tree',tree,'-p',os.environ['GITHUB_SHA'],data=b'Fix portable paths and verification UI; name upstream source directory\n\nPublish the locally audited source tree; temporary publication files are excluded.\n')
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          git('-c','http.extraheader=AUTHORIZATION: basic '+auth,'push','origin',commit+':refs/heads/master')
          print('Published audited source tree:',tree)
          print('Commit:',commit)
          PY
